<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Save Image As</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    code { word-break: break-all; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    button.primary { font-weight: 600; }
    .muted { opacity: 0.75; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section id="grant" hidden>
    <h1>Allow access to images from this site?</h1>
    <p>To convert this image, the extension needs to read it from <code id="origin"></code>.</p>
    <p class="muted">The image is converted on your device. Nothing is uploaded, tracked or stored.</p>
    <div class="buttons">
      <button id="allow-site" class="primary">Allow this site</button>
      <button id="allow-all">Allow all sites</button>
      <button id="cancel">Cancel</button>
    </div>
  </section>

  <section id="error" hidden>
    <h1>Couldn't save this image</h1>
    <p id="error-msg"></p>
    <div class="buttons"><button id="close">Close</button></div>
  </section>

  <script type="module" src="page.js"></script>
</body>
</html>
